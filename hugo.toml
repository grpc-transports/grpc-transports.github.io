baseURL = "https://grpc-transports.github.io/"
title = "grpc-transports"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "result" is the honest headline (what it does, with limits).
# "kind" = the underlying carrier (wireguard / ssh / vsock); every repo is a Go library.
[[params.repos]]
  name = "wireguard"
  accel = "gRPC over a WireGuard overlay (net.Listener + grpc.DialOption)"
  kind = "wireguard"
  type = "lib"
  arch = "userspace (wireguard-go + gVisor netstack) or kernel WireGuard"
  result = "Tunnels gRPC between VMs over a WireGuard overlay regardless of host. Two backends ship side by side: a default userspace data path (wireguard-go + gVisor netstack, no privileges, any OS) and a Linux kernel-WireGuard backend (CAP_NET_ADMIN, line-rate) brought up via pure-Go netlink + wgctrl — no iproute2 or wireguard-tools in the rootfs."
[[params.repos]]
  name = "ssh"
  accel = "gRPC over an SSH tunnel (net.Listener + grpc.DialOption)"
  kind = "ssh"
  type = "lib"
  arch = "Ed25519 host keys + SSH agent forwarding"
  result = "Wraps inbound SSH connections as gRPC-ready net.Conn for a standard grpc.Server, and dials gRPC channels over SSH from the client. Ed25519 host-key auto-generation and SSH agent forwarding for client auth. Suited to human-driven CLI clients where SSH's per-user key model fits."
[[params.repos]]
  name = "vsock"
  accel = "gRPC over AF_VSOCK (net.Conn Dialer + net.Listener)"
  kind = "vsock"
  type = "lib"
  arch = "Linux virtio-vsock (KVM/QEMU or Apple VZ); amd64 · arm64 · riscv64 · loong64 · ppc64le · s390x"
  result = "Host↔guest gRPC over the AF_VSOCK address family, addressed by (context id, port) with no IP stack in the guest. Listen returns a net.Listener whose connections report the peer CID; Dialer.DialContext matches grpc.WithContextDialer. Dependency-free pure Go (CGO=0); the syscall layer is seamed for 100% coverage, error branches included, on all six 64-bit arches. Linux-only, with a portable non-Linux stub so cross-platform callers still build."
[[params.repos]]
  name = "websocket"
  accel = "gRPC over a WebSocket — the carrier that works inside the browser (net.Listener + grpc.DialOption)"
  kind = "websocket"
  type = "lib"
  arch = "native (coder/websocket) + js/wasm (syscall/js, zero deps); amd64 · arm64 · riscv64 · loong64 · ppc64le · s390x"
  result = "Tunnels gRPC over a WebSocket, so the same client compiles and runs under GOOS=js/GOARCH=wasm and speaks full gRPC in the browser — including client-streaming and bidirectional streaming — with no Envoy/grpc-web sidecar. grpc-go runs its HTTP/2 framing in userspace over a net.Conn wrapping the WebSocket; the server is a plain grpc.Server behind net.Listener. Two client backends behind one signature (coder/websocket native, syscall/js on wasm). 100% native coverage plus a Node-driven js/wasm end-to-end test."
[[params.repos]]
  name = "webrtc"
  accel = "gRPC between two peers that cannot reach each other (net.Listener + grpc.DialOption)"
  kind = "webrtc"
  type = "lib"
  arch = "pion/webrtc; DTLS end to end, no relay and no sidecar"
  result = "gRPC assumes one side can listen and the other can dial. Two peers behind household routers can do neither, and there is nothing in between that either controls. The server exposes a net.Listener over an RTCPeerConnection and the client a grpc.DialOption over a data channel; everything above stays ordinary gRPC. It deliberately does NOT do signalling: the two have to swap a session description first, and how — a mail, a chat window, a QR code, a rendezvous somebody already runs — is not a transport's business, and is usually already decided by whatever the peers are doing together."
[[params.repos]]
  name = "control"
  accel = "the admin plane, not a transport"
  kind = "control"
  type = "lib"
  arch = "unix socket (0600) or TCP with mandatory mTLS"
  result = "Where a daemon's own control surface listens, and who is allowed to call it. A unix socket created 0600 so the filesystem answers the question, or TCP that REQUIRES client certificates -- there is no third option, because an admin plane reachable without proof is the one listener nobody meant to open. The caller's identity reaches the handler, so a method can refuse by name rather than by trust in the listener."
