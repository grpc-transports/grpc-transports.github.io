<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="grpc-transports">
  <defs>
    <linearGradient id="grpcgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BD4A8"/>
      <stop offset="1" stop-color="#0E7F6B"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#grpcgrad)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
